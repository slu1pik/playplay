name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Icon & Android Project Structure
        run: |
          mkdir -p src/com/slu1pik/pocketpowder res/drawable assets gen obj
          cp index.html assets/index.html

          if [ -f "icon.png" ]; then
            cp icon.png res/drawable/icon.png
          else
            pip install pillow
            python3 - << 'EOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (512, 512), (10, 6, 20, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([24, 24, 488, 488], radius=96, outline=(168, 85, 247, 255), width=12)
          d.polygon([(140, 100), (372, 100), (270, 256), (242, 256)], fill=(56, 189, 248, 220), outline=(192, 132, 252, 255))
          d.polygon([(242, 256), (270, 256), (372, 412), (140, 412)], fill=(236, 72, 153, 220), outline=(192, 132, 252, 255))
          img.save("res/drawable/icon.png", "PNG")
          EOF
          fi

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.slu1pik.pocketpowder"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="Pocket Powder"
                  android:icon="@drawable/icon"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/slu1pik/pocketpowder/MainActivity.java
          package com.slu1pik.pocketpowder;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor("#07050c"));
                      getWindow().setNavigationBarColor(Color.parseColor("#07050c"));
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#07050c"));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR1) {
                      s.setMediaPlaybackRequiresUserGesture(false);
                  }

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void vibrate(int ms) {
                          try {
                              Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                              if (v != null && v.hasVibrator()) {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                                  } else {
                                      v.vibrate(ms);
                                  }
                              }
                          } catch (Exception ignored) {}
                      }
                  }, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("tg://"))) {
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(i);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              return shouldOverrideUrlLoading(view, request.getUrl().toString());
                          }
                          return false;
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compile and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip
          "$BUILD_TOOLS/aapt2" link -o unaligned.apk -I "$PLATFORM/android.jar" --manifest AndroidManifest.xml -A assets --java gen res.zip

          javac --release 8 -cp "$PLATFORM/android.jar" -d obj gen/com/slu1pik/pocketpowder/R.java src/com/slu1pik/pocketpowder/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output . obj/com/slu1pik/pocketpowder/*.class

          zip -uj unaligned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore release.keystore -alias slu1pik -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=slu1pik, OU=Games, O=slu1pik, L=RU, S=RU, C=RU"

          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 \
            --out PocketPowder-ASMR.apk aligned.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketPowder-ASMR-APK
          path: PocketPowder-ASMR.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pocket Powder ASMR v1.0.${{ github.run_number }} (APK)"
          files: PocketPowder-ASMR.apk
